# ==============================================================================
# Nginx Hardened Production Configuration with Strict HTTPS & Security Headers
# ==============================================================================

# Rate Limiting Zones: Mitigate Brute Force and DoS Attacks
limit_req_zone $binary_remote_addr zone=api_general_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=api_auth_limit:10m rate=5r/m;

# 1. HTTP Server - Strict Redirect to HTTPS
server {
    listen 80;
    server_name _;

    # Block access to hidden files and dotfiles (.env, .git)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Redirect all HTTP traffic to HTTPS (Port 443)
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server - Modern TLS 1.2 / 1.3 Only
server {
    listen 443 ssl http2;
    server_name _;

    # Maximum upload size for handwriting photos and voice recordings
    client_max_body_size 50M;

    # SSL / TLS Modern Cryptographic Configuration
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # Enforce TLS 1.2 and TLS 1.3 only (Disable obsolete SSLv3, TLS 1.0, TLS 1.1)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # HTTP Strict Transport Security (HSTS - 2 years with SubDomains and Preload)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Clickjacking Defense & MIME Sniffing Prevention
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;

    # Content Security Policy (CSP)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https: blob:; media-src 'self' data: blob: https:; connect-src 'self' https:; font-src 'self' https: data:; frame-ancestors 'none'; object-src 'none'; base-uri 'self';" always;

    # Block access to hidden files and sensitive dotfiles
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Frontend Single Page Application (SPA)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # API Proxy with Rate Limiting
    location /api/ {
        limit_req zone=api_general_limit burst=30 nodelay;

        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Authentication Specific Rate Limiting
    location /api/v1/auth/login {
        limit_req zone=api_auth_limit burst=5 nodelay;

        proxy_pass http://backend:8000/api/v1/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Static Educational Audio Files
    location /static/audio/ {
        proxy_pass http://backend:8000/static/audio/;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Uploads (Handwriting Images & Recordings) - No Script Execution
    location /uploads/ {
        # Strictly forbid execution of any scripts in the uploads directory
        location ~* \.(php|phtml|py|sh|pl|cgi|exe|bat|cmd|js|html|htm|svg)$ {
            deny all;
            return 403;
        }

        proxy_pass http://backend:8000/uploads/;
        proxy_set_header Host $host;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
